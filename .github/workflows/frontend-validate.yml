name: Validate Frontend

on:
  pull_request:
    paths:
      - 'package.json'
      - 'frontend/package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.npmrc'
      - '.github/workflows/**'
      - 'vercel.json'
      - 'frontend/astro.config.mjs'
      - 'frontend/tsconfig.json'
      - 'frontend/src/**'
      - 'frontend/scripts/**'
      - 'frontend/public/**'
      - 'frontend/public/vendor/htmx.min.js'
      - 'studio/**'
  push:
    branches-ignore:
      - main
    paths:
      - 'package.json'
      - 'frontend/package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.npmrc'
      - '.github/workflows/**'
      - 'vercel.json'
      - 'frontend/astro.config.mjs'
      - 'frontend/tsconfig.json'
      - 'frontend/src/**'
      - 'frontend/scripts/**'
      - 'frontend/public/**'
      - 'frontend/public/vendor/htmx.min.js'
      - 'studio/**'

permissions:
  contents: read

jobs:
  validate-frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Align npm version
        run: npm install --global npm@11.21.3

      - name: Install dependencies
        run: npm ci

      - name: Check HTMX asset sync
        run: npm run check:htmx --workspace=frontend

      - name: Check Astro templates and types
        run: npm run check:astro --workspace=frontend

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Check dependency graph
        run: npm run check-deps

      - name: Run frontend tests
        run: npm test --workspace=frontend -- --run

      - name: Typecheck Studio
        run: npx tsc -p studio/tsconfig.json --noEmit

      - name: Run Studio tests
        run: npm test --workspace=studio -- --run

      - name: Build Studio
        run: npm run build --workspace=studio
